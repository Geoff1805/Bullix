name = "bullix"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "web"

# Cloudflare D1 Database binding (Europe de l'Ouest / weur)
[[d1_databases]]
binding = "DB"
database_name = "bullix-db"
database_id = "7bfc27fe-0d17-437f-96a1-d99a66bb5466"

# Cloudflare KV for external API caching (BnF, Open Library)
[[kv_namespaces]]
binding = "CACHE_KV"
id = "86cd4a3466f24257a2ed4d993abd85c9"

# Cloudflare R2 Bucket for cover art & locker photos (Juridiction UE)
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "bullix-images"
jurisdiction = "eu"
