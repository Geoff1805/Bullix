name = "bullix"
compatibility_date = "2024-11-01"
pages_build_output_dir = "web"

# Note : Pour Cloudflare Pages, les liaisons (bindings) D1, KV et R2
# sont configurées dans l'interface Cloudflare :
# Paramètres > Fonctions > Liaisons (D1: DB, KV: CACHE_KV, R2: IMAGES_BUCKET).
# (Voir DEPLOYMENT_WINDOWS_CLOUDFLARE.md - Étape 4)
#
# Pour déclarer les bindings directement dans ce fichier, renseignez
# vos véritables IDs Cloudflare (les placeholders bloquent le déploiement) :
#
# [[d1_databases]]
# binding = "DB"
# database_name = "bullix-db"
# database_id = "<votre-id-d1-ici>"
#
# [[kv_namespaces]]
# binding = "CACHE_KV"
# id = "<votre-id-kv-ici>"
#
# [[r2_buckets]]
# binding = "IMAGES_BUCKET"
# bucket_name = "bullix-images"
