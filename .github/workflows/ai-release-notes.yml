name: "AI Release Notes (Gemini)"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract Commit Log
        id: commits
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..${{ github.ref_name }}" --oneline > /tmp/commits.txt
          else
            git log -n 50 --oneline > /tmp/commits.txt
          fi

      - name: Generate Release Notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Release ${{ github.ref_name }}" > /tmp/notes.md
            cat /tmp/commits.txt >> /tmp/notes.md
          else
            python3 scripts/ai_assistant.py release-notes \
              --tag "${{ github.ref_name }}" \
              --commits-file /tmp/commits.txt > /tmp/notes.md
          fi

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file /tmp/notes.md \
            --draft=false
