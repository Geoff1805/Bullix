name: Android CI & Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Run Automated Unit Tests
        run: ./gradlew test --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3

      - name: Prepare Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.jks" >> $GITHUB_ENV
            echo "Keystore de release unifié configuré."
          fi
          if [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ env.RELEASE_KEYSTORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "Building APK with versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"
          ./gradlew assembleRelease -PappVersionCode="${VERSION_CODE}" -PappVersionName="${VERSION_NAME}"

      - name: Prepare Normalized APK
        run: |
          mkdir -p build-artifacts
          RELEASE_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          fi
          cp "$RELEASE_APK" "build-artifacts/Bullix-v${VERSION_NAME}.apk"
          cp "$RELEASE_APK" build-artifacts/Bullix.apk
          ls -lh build-artifacts/

      - name: Upload Normalized APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bullix-v${{ env.VERSION_NAME || 'latest' }}.apk
          path: build-artifacts/Bullix-v*.apk
          retention-days: 3

      - name: Publish Direct Unzipped APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          TAG="v${VERSION_NAME}"
          echo "Publishing direct Bullix.apk for tag $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build-artifacts/Bullix-v${VERSION_NAME}.apk" "build-artifacts/Bullix.apk" --clobber
          else
            gh release create "$TAG" "build-artifacts/Bullix-v${VERSION_NAME}.apk" "build-artifacts/Bullix.apk" \
              --title "Bullix v${VERSION_NAME}" \
              --notes "Version ${VERSION_NAME} compilée automatiquement par GitHub Actions. Fichier APK direct sans archive zip."
          fi
