name: Android CI & Build APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test & Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Run Automated Unit Tests
        run: ./gradlew test --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3

      - name: Build Debug APK
        run: |
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "Building APK with versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"
          ./gradlew assembleDebug -PappVersionCode="${VERSION_CODE}" -PappVersionName="${VERSION_NAME}"

      - name: Prepare Normalized APK
        run: |
          mkdir -p build-artifacts
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          cp "$DEBUG_APK" build-artifacts/Bullix.apk
          ls -lh build-artifacts/

      - name: Upload Normalized APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bullix.apk
          path: build-artifacts/Bullix.apk
          retention-days: 3

      - name: Publish Direct Unzipped APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          TAG="v${VERSION_NAME}"
          echo "Publishing direct Bullix.apk for tag $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build-artifacts/Bullix.apk --clobber
          else
            gh release create "$TAG" build-artifacts/Bullix.apk \
              --title "Bullix v${VERSION_NAME}" \
              --notes "Version ${VERSION_NAME} compilée automatiquement par GitHub Actions. Fichier APK direct sans archive zip."
          fi
