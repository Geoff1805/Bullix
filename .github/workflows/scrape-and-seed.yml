name: Scraping & Seed Database (BDthèque & BDvore)

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source des données'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - bdtheque
          - bdovore
      max_per_category:
        description: 'Nombre de séries par catégorie (BD, Manga, Comics)'
        required: true
        default: '10'
        type: string
      categories:
        description: 'Catégories séparées par des virgules'
        required: true
        default: 'BD,Manga,Comics'
        type: string
      upload_to_r2:
        description: 'Uploader directement les jaquettes vers Cloudflare R2 (bullix-images)'
        required: true
        default: true
        type: boolean
      apply_to_d1:
        description: 'Injecter le batch SQL dans Cloudflare D1 (bullix-db)'
        required: true
        default: true
        type: boolean
  schedule:
    # Exécution automatique mensuelle : le 1er du mois à 03h00 UTC
    - cron: '0 3 1 * *'

jobs:
  scrape_and_seed:
    name: Scrape & Seed Cloudflare D1 + R2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --legacy-peer-deps; else npm install --legacy-peer-deps; fi

      - name: Typecheck Scripts
        run: npm run typecheck:scripts

      - name: Execute Scraping Engine
        run: |
          SOURCE="${{ inputs.source || 'all' }}"
          MAX="${{ inputs.max_per_category || '10' }}"
          CATEGORIES="${{ inputs.categories || 'BD,Manga,Comics' }}"
          
          echo "Démarrage du scraping Bullix..."
          echo "Source: $SOURCE | Max: $MAX | Catégories: $CATEGORIES"
          
          npx tsx scripts/scraping/index.ts \
            --source="$SOURCE" \
            --max="$MAX" \
            --categories="$CATEGORIES" \
            --output="scraped_data.json" \
            --sql="generated_seed.sql"

      # Vérification de la présence des Secrets Cloudflare
      - name: Vérifier la Présence des Identifiants Cloudflare
        id: check_credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning title=Secrets Cloudflare Manquants::CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID n'est pas configuré dans GitHub Secrets."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "Secrets Cloudflare détectés. Transfert Cloudflare activé."
          fi

      # Transfert DIRECT des jaquettes vers Cloudflare R2 (Aucune sauvegarde image dans GitHub)
      - name: Uploader Directement les Jaquettes vers Cloudflare R2 (Zero Image dans GitHub)
        if: ${{ inputs.upload_to_r2 != false && steps.check_credentials.outputs.has_token == 'true' }}
        run: |
          echo "Transfert direct des jaquettes vers Cloudflare R2 (bullix-images, juridiction UE)..."
          echo "Aucune image n'est persistée sur GitHub."
          npx tsx scripts/scraping/upload_covers_to_r2.ts scraped_data.json generated_seed.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Sauvegarde temporaire exclusive des métadonnées texte (SQL & JSON), aucune image
      - name: Sauvegarder Temporairement les Métadonnées DB (GitHub Artifacts - 14j)
        uses: actions/upload-artifact@v7
        with:
          name: bullix-scraped-database-run-${{ github.run_number }}
          path: |
            scraped_data.json
            generated_seed.sql
          retention-days: 14

      # Application du schéma global Cloudflare D1 si la base est vierge
      - name: Initialiser le Schéma D1 (schema.sql)
        if: ${{ steps.check_credentials.outputs.has_token == 'true' && (inputs.apply_to_d1 != false) }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute bullix-db --remote --file=schema.sql

      # Injection du batch SQL dans Cloudflare D1
      - name: Injecter le Seed de Données dans Cloudflare D1 (bullix-db)
        if: ${{ steps.check_credentials.outputs.has_token == 'true' && (inputs.apply_to_d1 != false) }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute bullix-db --remote --file=generated_seed.sql
