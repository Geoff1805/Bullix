name: Dependency Review & Security Scanning

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Scan hebdomadaire tous les lundis à 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review (PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Dependency Review
        # Dependency Review Action requiert un dépôt public ou GitHub Advanced Security (GHAS) sur dépôt privé
        if: "!github.event.repository.private"
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
        continue-on-error: true

      - name: Info dépôt privé sans GHAS
        if: github.event.repository.private
        run: |
          echo "ℹ️ Le repository est privé sans GitHub Advanced Security (GHAS) actif."
          echo "La revue des dépendances PR est ignorée. L'audit de sécurité npm & gradle s'exécute dans le job security-audit."

  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit NPM Dependencies
        run: |
          if [ ! -f package-lock.json ]; then npm i --package-lock-only --no-fund --no-audit || true; fi
          npm audit --audit-level=high || true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle Dependencies
        run: |
          gradle -q dependencies --configuration releaseRuntimeClasspath || gradle -q dependencies
