<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bullix — Gestionnaire de Collection BD Offline-First</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <style>
    :root {
      --pico-primary: #ffb300;
      --pico-primary-background: #ffb300;
      --pico-primary-underline: rgba(255, 179, 0, 0.5);
    }
    header {
      border-bottom: 1px solid var(--pico-muted-border-color);
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .badge-owned { background-color: #2e7d32; color: #fff; }
    .badge-missing { background-color: #d32f2f; color: #fff; }
    .badge-location { background-color: #0288d1; color: #fff; }
    .badge-genre { background-color: #6a1b9a; color: #fff; }
    .album-card {
      display: flex;
      gap: 1rem;
      border: 1px solid var(--pico-muted-border-color);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      background: var(--pico-card-background-color);
    }
    .album-cover {
      width: 70px;
      height: 100px;
      object-fit: cover;
      border-radius: 4px;
      background: #333;
      flex-shrink: 0;
    }
    .search-stats {
      font-size: 0.85rem;
      color: var(--pico-muted-color);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body class="container">
  <header>
    <nav>
      <ul>
        <li><strong>📚 Bullix</strong></li>
      </ul>
      <ul>
        <li><a href="#collection-section">Collection</a></li>
        <li><a href="#lookup-section">Recherche Catalogue</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="lookup-section">
      <h3>🔍 Recherche Globale d'Album (Tous champs : ISBN, Titre, Série, Auteur)</h3>
      <form id="lookup-form" onsubmit="handleLookup(event)">
        <fieldset role="group">
          <input type="text" id="lookup-input" placeholder="Entrez un titre, série, auteur, éditeur ou ISBN..." required />
          <input type="submit" value="Rechercher" />
        </fieldset>
      </form>
      <div id="lookup-result"></div>
    </section>

    <hr />

    <section id="collection-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
        <h3>📖 Ma Collection</h3>
        <button class="outline" onclick="loadSampleData()">Réinitialiser Exemple</button>
      </div>

      <!-- Recherche tous champs sur la collection locale -->
      <fieldset role="group">
        <input 
          type="search" 
          id="collection-search-input" 
          placeholder="🔎 Filtrer ma collection sur TOUS les champs (titre, série, auteur, éditeur, casier, tome, ISBN...)" 
          oninput="filterCollection()" 
        />
        <button type="button" class="secondary" onclick="clearCollectionSearch()">Effacer</button>
      </fieldset>

      <div id="collection-stats" class="search-stats"></div>
      <div id="collection-list">
        <p><em>Chargement de votre collection...</em></p>
      </div>
    </section>
  </main>

  <script>
    // Données d'exemple de collection
    let myCollection = [
      {
        seriesTitle: "Astérix",
        albumTitle: "Astérix le Gaulois",
        volumeNumber: 1,
        authors: "René Goscinny, Albert Uderzo",
        publisher: "Dargaud",
        publishedYear: 1961,
        locationName: "Salon › Bibliothèque › Casier n°1",
        condition: "Très bon",
        editionInfo: "Édition Originale",
        seriesType: "Franco-belge",
        isbn: "9782012101333",
        coverUrl: "https://covers.openlibrary.org/b/isbn/9782012101333-M.jpg"
      },
      {
        seriesTitle: "Blacksad",
        albumTitle: "Quelque part entre les ombres",
        volumeNumber: 1,
        authors: "Juan Díaz Canales, Juanjo Guarnido",
        publisher: "Dargaud",
        publishedYear: 2000,
        locationName: "Salon › Bibliothèque › Casier n°2",
        condition: "Neuf",
        editionInfo: "Tirage courant",
        seriesType: "Franco-belge",
        isbn: "9782205049657",
        coverUrl: "https://covers.openlibrary.org/b/isbn/9782205049657-M.jpg"
      },
      {
        seriesTitle: "Tintin",
        albumTitle: "Le Lotus bleu",
        volumeNumber: 5,
        authors: "Hergé",
        publisher: "Casterman",
        publishedYear: 1946,
        locationName: "Chambre › Étagère BD › Casier A",
        condition: "Bon",
        editionInfo: "Fac-similé",
        seriesType: "Franco-belge",
        isbn: "9782203001046",
        coverUrl: "https://covers.openlibrary.org/b/isbn/9782203001046-M.jpg"
      },
      {
        seriesTitle: "One Piece",
        albumTitle: "Romance Dawn",
        volumeNumber: 1,
        authors: "Eiichiro Oda",
        publisher: "Glénat",
        publishedYear: 1997,
        locationName: "Bureau › Tour Manga",
        condition: "Très bon",
        editionInfo: "Tirage standard",
        seriesType: "Manga",
        isbn: "9782723488525",
        coverUrl: "https://covers.openlibrary.org/b/isbn/9782723488525-M.jpg"
      }
    ];

    function normalize(text) {
      if (!text) return '';
      return text
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function renderCollection(items) {
      const list = document.getElementById('collection-list');
      const stats = document.getElementById('collection-stats');
      stats.textContent = `${items.length} album(s) affiché(s) sur un total de ${myCollection.length}`;

      if (items.length === 0) {
        list.innerHTML = '<article><em>Aucun album ne correspond à votre recherche multi-champs.</em></article>';
        return;
      }

      list.innerHTML = items.map(item => `
        <div class="album-card">
          <img class="album-cover" src="${item.coverUrl}" alt="${item.albumTitle}" onerror="this.style.display='none'" />
          <div>
            <h4>${item.seriesTitle} — Tome ${item.volumeNumber} : ${item.albumTitle}</h4>
            <p style="margin-bottom: 0.3rem;">
              <span class="badge badge-owned">Possédé</span>
              <span class="badge badge-location">${item.locationName}</span>
              <span class="badge badge-genre">${item.seriesType}</span>
            </p>
            <small>
              <strong>Auteurs :</strong> ${item.authors} • 
              <strong>Éditeur :</strong> ${item.publisher} (${item.publishedYear}) • 
              <strong>État :</strong> ${item.condition} • 
              <strong>ISBN :</strong> ${item.isbn}
            </small>
          </div>
        </div>
      `).join('');
    }

    function filterCollection() {
      const query = document.getElementById('collection-search-input').value.trim();
      if (!query) {
        renderCollection(myCollection);
        return;
      }

      const queryTokens = query.split(/\s+/).map(normalize).filter(Boolean);

      const filtered = myCollection.filter(item => {
        const fields = [
          item.seriesTitle,
          item.albumTitle,
          item.isbn,
          item.isbn.replace(/-/g, ''),
          item.authors,
          item.publisher,
          item.publishedYear,
          item.volumeNumber,
          `tome ${item.volumeNumber}`,
          `vol ${item.volumeNumber}`,
          item.locationName,
          item.condition,
          item.editionInfo,
          item.seriesType
        ].map(normalize);

        // Tous les mots de recherche doivent matcher au moins un champ
        return queryTokens.every(token => fields.some(field => field.includes(token)));
      });

      renderCollection(filtered);
    }

    function clearCollectionSearch() {
      document.getElementById('collection-search-input').value = '';
      filterCollection();
    }

    function loadSampleData() {
      clearCollectionSearch();
    }

    async function handleLookup(e) {
      e.preventDefault();
      const rawInput = document.getElementById('lookup-input').value.trim();
      const container = document.getElementById('lookup-result');
      container.innerHTML = '<aria-busy="true">Recherche en cours dans Bullix D1...</aria-busy>';

      const isIsbn = /^[0-9xX\- ]{9,17}$/.test(rawInput) && rawInput.replace(/[-\s]/g, '').length >= 10;

      try {
        if (isIsbn) {
          const isbn = rawInput.replace(/[-\s]/g, '');
          const res = await fetch(`/api/lookup/isbn?isbn=${encodeURIComponent(isbn)}`);
          if (!res.ok) {
            container.innerHTML = `<article style="border-left: 4px solid #d32f2f;"><strong>Non répertorié</strong> : Aucun album trouvé pour l'ISBN ${isbn}.</article>`;
            return;
          }
          const data = await res.json();
          const album = data.album || data.data;
          const series = data.series;
          const seriesAlbums = data.series_albums || [];

          container.innerHTML = `
            <article style="border-left: 4px solid #2e7d32;">
              <h4>${series ? series.title : 'Album'} — Tome ${album.volume_number || 1} : ${album.title || 'Sans titre'}</h4>
              <p><strong>Auteurs :</strong> ${album.authors || 'Non renseigné'} | <strong>Éditeur :</strong> ${album.publisher || 'Non renseigné'}</p>
              <p><span class="badge badge-owned">Source : ${data.source}</span> ${seriesAlbums.length ? `<span class="badge badge-location">${seriesAlbums.length} tomes de la série en cache</span>` : ''}</p>
            </article>
          `;
        } else {
          // Recherche multi-champs sur l'API globale
          const res = await fetch(`/api/lookup/search?q=${encodeURIComponent(rawInput)}`);
          if (!res.ok) {
            container.innerHTML = `<article style="border-left: 4px solid #d32f2f;">Erreur lors de la recherche catalogue.</article>`;
            return;
          }
          const data = await res.json();
          const results = data.results || [];
          if (results.length === 0) {
            container.innerHTML = `<article style="border-left: 4px solid #d32f2f;">Aucun album trouvé dans le catalogue pour "<strong>${rawInput}</strong>".</article>`;
            return;
          }

          container.innerHTML = `
            <article style="border-left: 4px solid #2e7d32;">
              <h5>${results.length} résultat(s) trouvé(s) pour "${rawInput}" :</h5>
              ${results.slice(0, 5).map(item => `
                <div style="margin-bottom: 0.8rem; border-bottom: 1px solid var(--pico-muted-border-color); padding-bottom: 0.5rem;">
                  <strong>${item.series_title || 'Série'}</strong> — Tome ${item.volume_number} : <em>${item.album_title || 'Sans titre'}</em><br/>
                  <small>${item.authors || 'Auteurs non renseignés'} • ${item.publisher || 'Éditeur non renseigné'} (${item.published_year || 'N/C'}) • ISBN : ${item.isbn || 'N/C'}</small>
                </div>
              `).join('')}
            </article>
          `;
        }
      } catch (err) {
        container.innerHTML = `<article style="border-left: 4px solid #d32f2f;">Erreur de connexion : ${err.message}</article>`;
      }
    }

    // Affichage initial de la collection
    renderCollection(myCollection);
  </script>
</body>
</html>
